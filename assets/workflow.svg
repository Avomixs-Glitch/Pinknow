      <circle cx="38" cy="41" r="16" fill="#ff6b4a" fill-opacity=".14"/><path d="M38 31v18m-7-7 7 7 7-7" stroke="#ff8a6a" stroke-width="2" fill="none"/>
      <text x="66" y="47" fill="#ffffff" font-size="20" font-weight="650">Import</text>
      <text x="24" y="92" fill="#9c9c9d" font-size="15">Browser extension</text><text x="24" y="118" fill="#9c9c9d" font-size="15">or official export</text>
    </g>
    <g transform="translate(622 99)">
      <rect width="230" height="162" rx="22" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".1"/>
      <circle cx="38" cy="41" r="16" fill="#ff6b4a" fill-opacity=".14"/><path d="M29 36h18M29 42h12M29 48h15" stroke="#ff8a6a" stroke-width="2"/>
      <text x="66" y="47" fill="#ffffff" font-size="20" font-weight="650">Organize</text>
      <text x="24" y="92" fill="#9c9c9d" font-size="15">Projects, tags</text><text x="24" y="118" fill="#9c9c9d" font-size="15">and smart queues</text>
    </g>
    <g transform="translate(894 99)">
      <rect width="230" height="162" rx="22" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".1"/>
      <circle cx="38" cy="41" r="16" fill="#ff6b4a" fill-opacity=".14"/><circle cx="35" cy="38" r="6" fill="none" stroke="#ff8a6a" stroke-width="2"/><path d="m40 43 5 5" stroke="#ff8a6a" stroke-width="2"/>
      <text x="66" y="47" fill="#ffffff" font-size="20" font-weight="650">Find</text>
      <text x="24" y="92" fill="#9c9c9d" font-size="15">Search every chat</text><text x="24" y="118" fill="#9c9c9d" font-size="15">in seconds</text>
