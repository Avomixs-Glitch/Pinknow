      <text x="24" y="42" fill="#888990" font-size="12" font-weight="700" letter-spacing="1.5">SOURCES</text>
      <g fill="#ffffff" font-size="17" font-weight="600">
        <text x="24" y="82">ChatGPT</text><text x="24" y="112">Claude</text><text x="24" y="142">Gemini</text><text x="24" y="172">DeepSeek</text><text x="24" y="202">Grok</text>
      </g>
      <g fill="#ff6b4a"><circle cx="194" cy="76" r="4"/><circle cx="194" cy="106" r="4"/><circle cx="194" cy="136" r="4"/><circle cx="194" cy="166" r="4"/><circle cx="194" cy="196" r="4"/></g>
    </g>
    <g transform="translate(350 99)">
