<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">The pinknow workflow</title>
  <desc id="desc">Conversations from five AI providers flow through import, automatic organization, search, and workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0d10"/><stop offset="1" stop-color="#111216"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffb347"/><stop offset=".5" stop-color="#ff6b4a"/><stop offset="1" stop-color="#ff2f3a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1400" height="360" rx="28" fill="url(#bg)"/>
  <path d="M120 180H1280" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>
  <path d="M254 180H1150" stroke="url(#accent)" stroke-opacity=".28" stroke-width="12" filter="url(#glow)"/>
  <path d="M254 180H1150" stroke="url(#accent)" stroke-width="2"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(52 67)">
